# 最小 CI：Python 测试 + lint，web 前端构建。
# 注意：CI 是全新 checkout——data/*.db 与 GRAMMAR_TEST_PDF_DIR 均缺失，
# 相关真实库/真实 PDF 用例靠测试内的 skip 守卫自动跳过（见 tests/conftest.py、
# tests/test_taxonomy.py），ruff 由 pyproject.toml [tool.ruff] 钉在 E4/E7/E9/F。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（server extra + dev）
        run: uv sync --extra server --dev

      - name: Ruff lint
        run: uvx ruff check .

      - name: Pytest
        # CI 无真实库（data/*.db 均为本地构建产物，被 .gitignore 排除）：
        # 1) 把默认语法库指到 tmp——防止 create_app() 裸调在 data/ 下新建
        #    空库，骗过 test_taxonomy 的「文件存在」skip 守卫（连锁失败根因）
        # 2) 依赖真库的用例（taxonomy 例句/复习分流、ECDICT 查词、FCE
        #    reading 流程）由测试内守卫按库可用性自动跳过
        run: uv run pytest -q
        env:
          GRAMMAR_KB_DB: /tmp/gkb-ci-grammar.db
          # fce.db 同理：裸 create_app() 的 FceSubmissionStore 首次连接即
          # sqlite3.connect 建空文件（executescript 建表），若不隔离会在
          # data/ 下造出空 fce.db，骗过 test_reading 的真库 skip 守卫
          GRAMMAR_KB_FCE_DB: /tmp/gkb-ci-fce.db

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
