[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-kb"
version = "0.1.0"
description = "把 PDF 教材/讲义清洗并结构化为可检索、可溯源的知识点数据库（去水印、还原表格、FTS5 全文检索，CLI + MCP 就绪）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23,<2.0",   # fitz：span 级抽取（字体/位置/方向），用于水印过滤
    "pdfplumber>=0.11",     # 表格检测（在过滤后的字符上工作）
    "markdown>=3.6",        # Markdown → HTML（lecture/kp 的 --format html）
    "inflect>=7.0",         # 名词复数等词形变化（单词表用）
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]          # MCP 服务（可选）
server = ["fastapi>=0.110", "uvicorn>=0.27"]  # HTTP 服务（可选）

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
grammar-kb = "grammar_kb.cli:main"
grammar-kb-server = "grammar_kb.server:main"
grammar-kb-mcp = "grammar_kb.mcp_server:main"

[tool.setuptools.packages.find]
include = ["grammar_kb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: 需要真实 PDF 的端到端测试",
]
