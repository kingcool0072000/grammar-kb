[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-kb"
version = "0.2.0"
description = "把 PDF 教材/讲义清洗并结构化为可检索、可溯源的知识点数据库（去水印、还原表格、FTS5 全文检索，CLI + MCP 就绪）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23,<2.0",   # fitz：span 级抽取（字体/位置/方向），用于水印过滤
    "pdfplumber>=0.11",     # 表格检测（在过滤后的字符上工作）
    "markdown>=3.6",        # Markdown → HTML（lecture/kp 的 --format html）
    "inflect>=7.0",         # 名词复数等词形变化（单词表用）
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]          # MCP 服务（可选）
server = [
    "fastapi>=0.110",
    "httpx>=0.28.1",
    "uvicorn>=0.27",
    "python-multipart>=0.0.20",
]  # HTTP 服务（可选；python-multipart 供 epub 上传）

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
grammar-kb = "grammar_kb.cli:main"
grammar-kb-server = "grammar_kb.server:main"
grammar-kb-mcp = "grammar_kb.mcp_server:main"

[tool.ruff]
# 行宽按现有代码风格（绝大多数行 ≤100）放宽到 110；规则用 ruff 传统默认集
# （E4/E7/E9/F：pyflakes + 核心 pycodestyle 错误），不启用激进规则。
# 注意：ruff ≥0.12 起默认集已扩到数百条（UP/SIM/S 等），这里显式钉住以防
# 版本升级引入海量新违规。
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E741（变量名 l 歧义）：PDF/OCR 解析循环里 `l` 作"行"是局部惯用，改名纯噪音
ignore = ["E741"]

[tool.setuptools.packages.find]
include = ["grammar_kb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: 需要真实 PDF 的端到端测试",
]
